name: macOS Apple Silicon build

on:
  push:
    branches:
      - feat/macos-apple-silicon
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: npm ci
      - name: Check translations
        run: npm run check:i18n
      - name: Smoke-test macOS native PTY
        run: node scripts/check-mac-pty.mjs
      - name: Build ARM64 DMG and ZIP (unsigned test artifacts)
        run: npm run build:mac
      - name: Verify ARM64 application and PTY addon
        run: |
          test -d release/mac-arm64/OneAI.app
          file release/mac-arm64/OneAI.app/Contents/MacOS/OneAI | grep -q arm64
          file release/mac-arm64/OneAI.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/pty.node | grep -q arm64
          test -x release/mac-arm64/OneAI.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper
      - name: Upload macOS test builds
        uses: actions/upload-artifact@v4
        with:
          name: OneAI-macOS-arm64-unsigned
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
